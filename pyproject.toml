[project]
name = "mgcomb"
version = "0.1.0"
description = "Microgravity combustion analytics on NASA PSI data: cleaning, baseline models and a Streamlit dashboard"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "duckdb>=1.0",
    "pyarrow>=16",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgcomb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: re-runs the reference scripts (deselected by default)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PD"]
